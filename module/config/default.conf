# CODM Optimizer - user configuration
#
# This file is read with a KEY=VALUE parser (it is never executed), so a
# typo can not break the engine.  The values here win over the profile
# defaults, which live in <module>/profiles/<profile>.conf.
#
# Edit it with any text editor (keep Unix line endings) and the running
# engine picks the change up within 15 seconds, or use:
#     codm-optimizer set PROFILE performance

# Which profile to use: balanced | performance | extreme | battery
PROFILE=balanced

# ------------------------------------------------------------------ engine
# 1 = watch for CODM in the background, 0 = do nothing until re-enabled
ENGINE_ENABLED=1

# How often the engine looks for the game (seconds).
POLL_GAME_SEC=5
POLL_IDLE_SEC=15

# Re-apply the profile every N seconds while gaming, because some ROMs
# reset schedutil tunables on their own.
REAPPLY_SEC=60

# Seconds between temperature readings.
GUARD_INTERVAL_SEC=20

# 1 = log every knob write (noisy, useful when debugging a device)
VERBOSE_LOG=0

# ------------------------------------------------------- android game mode
# Uses the platform Game Mode API (cmd game ...). Nothing in the game is
# modified; this is the same path as the Android game dashboard.
GAME_MODE=1

# Ask for a frame rate override. 0 = leave the device default alone.
# Only honoured on Android 13+ and only when the game accepts a mode.
GAME_MODE_FPS=0

# Render scale for the performance mode: off | 0.5 - 1.0
# 0.9 is almost invisible, 0.6-0.7 is a big win on weak GPUs.
GAME_MODE_DOWNSCALE=off

# ---------------------------------------------------------------- display
# Keep the panel at its highest refresh rate while CODM is in front.
# This is what makes 90/120 fps actually reachable on most phones.
REFRESH_LOCK=1

# auto = highest the panel supports, or force a value like 90 or 120
REFRESH_HZ=auto

# ------------------------------------------------------------------ extra
# Extra CODM package names, space separated. The Global, Garena, VNG and
# Tencent builds are already known, this is only for regional re-releases.
EXTRA_PACKAGES=

# -------------------------------------------------------------- thermal
# The profile is dropped to stock when the battery reaches this
# temperature, and resumes 3C below it. This guard is always active.
TEMP_LIMIT_C=43
TEMP_RESUME_DELTA_C=3

# Raise CPU/GPU passive thermal trip points by this many degrees.
# 0 = never touch thermal policy (recommended). 2-4 is the useful range
# and the guard above still protects the phone.
THERMAL_LIFT_C=0
