#: adaptive - steps down gently as the phone warms up (recommended)
#
# Holds a balanced setup while the phone is cool, then lowers only the two
# knobs that cost the most heat - GPU floor and refresh rate - before the
# thermal limit is reached, instead of dropping everything at once.
# The engine still releases the whole profile at TEMP_LIMIT_C.

CPU_TUNE=1
CPU_UP_RATE_US=2000
CPU_DOWN_RATE_US=8000
CPU_MIN_PCT=0
CPU_GOVERNOR=auto

GPU_TUNE=1
GPU_MIN_PCT=35
GPU_GOVERNOR=auto

UCLAMP_TOPAPP_MIN=0
STUNE_BOOST=-1
IO_SCHED=auto
TOPAPP_CPUS=auto
TCP_TWEAK=1
TCP_CC=auto

# --- the ladder ---------------------------------------------------------
ADAPTIVE=1

# GPU floor (%) per temperature level
ADAPT_GPU_COOL=40
ADAPT_GPU_WARM=28
ADAPT_GPU_HOT=15

# Refresh rate per level: auto = panel maximum, or a number like 90
ADAPT_HZ_COOL=auto
ADAPT_HZ_WARM=auto
ADAPT_HZ_HOT=90

# Optional absolute thresholds in battery degrees C.  Leave unset/commented
# to derive them from TEMP_LIMIT_C (limit-5 and limit-2).
#ADAPT_COOL_BELOW=38
#ADAPT_WARM_BELOW=41

THERMAL_LIFT_C=0
