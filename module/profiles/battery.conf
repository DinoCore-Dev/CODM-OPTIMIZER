#: battery - longest sessions: low frequency floors, quick release
# Profiles only carry the kernel knobs.  Any key here can be overridden
# by the same key in /data/adb/codm-optimizer/config.conf.

CPU_TUNE=1
CPU_UP_RATE_US=4000
CPU_DOWN_RATE_US=4000
CPU_MIN_PCT=0
CPU_GOVERNOR=auto

GPU_TUNE=1
GPU_MIN_PCT=15
GPU_GOVERNOR=auto

UCLAMP_TOPAPP_MIN=0
STUNE_BOOST=-1
IO_SCHED=auto
TOPAPP_CPUS=auto
TCP_TWEAK=0
TCP_CC=auto

# Never lift thermal trips from a profile. Set THERMAL_LIFT_C in
# config.conf if you really want that, and read docs/SAFETY.md first.
THERMAL_LIFT_C=0
